services:
  backend:
    build:
      context: .
      target: backend
    environment:
      PORT: "3015"
      NODE_ENV: production
      DUMMY_MODE: "false"
      ALLOW_UNSIGNED_LINK: "false"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      APP_URL: "${APP_URL}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL}"
      TOKEN_SECRET: "${TOKEN_SECRET}"
      API_KEY: "${API_KEY}"
    ports:
      - "3015:3015"
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    ports:
      - "3014:80"
    restart: unless-stopped
