services:
  backend:
    build:
      context: .
      target: backend
    env_file:
      - path: .env
        format: raw
    environment:
      PORT: 3015
      NODE_ENV: production
      DUMMY_MODE: "false"
      ALLOW_UNSIGNED_LINK: "false"
    ports:
      - "3015:3015"
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    ports:
      - "3014:80"
    restart: unless-stopped
